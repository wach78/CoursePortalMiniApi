<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link href="/src/style.css" rel="stylesheet" />
        <title>Kursportalen</title>
    </head>

    <body>
        <main class="bg-gray-700 text-white min-h-screen">
            <section class="bg-gray-800 mb-6" id="hero">
                <header
                    class="flex justify-between bg-black text-white h-15 items-center p-3 text-xl"
                >
                    <h1>Kursportalen</h1>
                    <nav class="flex gap-10">
                        <h1>Start</h1>
                        <h1>Kurser</h1>
                        <h1>Kontakt</h1>
                    </nav>
                </header>
                <div id="introText" class="min-h-25 p-5">
                    <h1 class="text-3xl mb-1">Välkommen Till Kursportalen</h1>
                    <p>
                        Lär dig bygga moderna webbapplikationer <br />
                        Praktiska kurser inom webbutveckling, design och moderna
                        verktyg.
                    </p>
                </div>
                <div class="flex gap-8 p-5">
                    <button
                        class="p-3 bg-gray-950 rounded-lg hover:bg-gray-900 hover:cursor-pointer"
                    >
                        Se kurser
                    </button>
                    <button
                        class="p-3 bg-gray-950 rounded-lg hover:bg-gray-900 hover:cursor-pointer"
                    >
                        Kontakta oss
                    </button>
                </div>
            </section>
            <section class="bg-gray-800 mb-6" id="courses">
                <h1 class="text-3xl underline text-center">Kurser</h1>
                <select class="bg-gray-700 p-2" id="course-sort">
                    <option value="">Namn</option>
                    <option value="price:asc">Pris: Lägst först</option>
                    <option value="price:desc">Price: Högst först</option>
                    <option value="level:asc">Nivå: Enklast först</option>
                    <option value="level:desc">Nivå: Avancerat först</option>
                </select>
                <!--Kurser hamnar här-->
                <div class="flex gap-8 p-5">
                    <ul id="coursesList">
                        <li
                            class="bg-gray-200 text-black p-5 rounded-full flex flex-col"
                        >
                            Webbutveckling från grunden
                            <a class="text-blue-500 underline">[Läs mer]</a>
                        </li>
                    </ul>
                </div>
            </section>
            <section class="bg-gray-800 mb-6 p-3 text-center" id="course-view">
                <h1 class="text-3xl underline mb-2">Kursvy</h1>
                <!--Här syns den aktiva kursen-->
                <div
                    id="course-details"
                    class="gap-8 p-5 m-6 bg-gray-200 rounded-lg text-black flex flex-col"
                ></div>
            </section>
            <section class="bg-gray-800 mb-6 text-center" id="contact">
                <h1 class="text-3xl underline">Kontakt</h1>
                <div class="flex flex-col max-w-[50%] gap-2">
                    <div class="flex max-w-[20%]">
                        <label class="mr-3">Namn:</label
                        ><input type="text" class="bg-white text-black" />
                    </div>
                    <div class="flex text-nowrap max-w-[20%]">
                        <label class="mr-3">E-postaddress:</label
                        ><input type="email" class="bg-white text-black" />
                    </div>
                    <div class="flex text-nowrap">
                        <label class="mr-3">Meddelande:</label
                        ><input type="text" class="bg-white text-black" />
                    </div>
                </div>
            </section>
        </main>
        <footer id="footer" class="h-10 bg-gray-200">
            <h1>Kursportalen @ 2026</h1>
        </footer>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
