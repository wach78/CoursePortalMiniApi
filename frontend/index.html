<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Kursportalen är en webbapplikation som erbjuder kurser inom webbutveckling,
      design och moderna verktyg. Lär dig bygga moderna webbapplikationer med praktiska kurser."
        />
        <link href="/src/style.css" rel="stylesheet" />
        <title>Kursportalen</title>
    </head>
    <body>
        <main class="bg-gray-700 text-white min-h-screen">
            <section id="hero">
                <header
                    class="flex justify-between bg-black text-white h-15 items-center p-3 text-xl"
                >
                    <h1>Kursportalen</h1>
                    <nav class="flex gap-10">
                        <a href="#courses">Kurser</a>
                        <a href="#contact">Kontakt</a>
                    </nav>
                </header>
                <div id="introText" class="flex justify-between min-h-25 p-5">
                    <div>
                        <h1 class="text-3xl mb-1">
                            Välkommen Till Kursportalen
                        </h1>
                        <p>
                            Lär dig bygga moderna webbapplikationer <br />
                            Praktiska kurser inom webbutveckling, design och
                            moderna verktyg.
                        </p>
                    </div>
                    <img
                        class="max-w-1/2 shadow-xl opacity-70 rounded-lg object-cover object-center"
                        alt="image of code"
                        src="/src/assets/image_new.webp"
                    />
                </div>
            </section>
            <section class="bg-gray-800 mb-6 p-2" id="courses">
                <h1 class="text-3xl underline text-center">Kurser</h1>
                <div class="border border-white p-1 ml-6 max-w-68">
                    <label for="course-sort" class="p-1">Sortering:</label>
                    <select class="p-1" id="course-sort">
                        <option value="date:desc">Nyast</option>
                        <option value="date:asc">Äldst</option>
                        <option value="name:asc">Namn A-Ö</option>
                        <option value="name:desc">Namn Ö-A</option>
                        <option value="price:asc">Pris: Lägst först</option>
                        <option value="price:desc">Price: Högst först</option>
                        <option value="level:asc">Nivå: Enklast först</option>
                        <option value="level:desc">
                            Nivå: Avancerat först
                        </option>
                    </select>
                </div>
                <!--Kurser hamnar här-->
                <div class="flex gap-8 p-5">
                    <ul id="coursesList"></ul>
                </div>
            </section>
            <section class="bg-gray-800 mb-6 p-3 text-center" id="course-view">
                <h1 class="text-3xl underline mb-2">Kursvy</h1>
                <!--Här syns den aktiva kursen-->
                <div
                    id="course-details"
                    class="gap-8 p-5 m-6 bg-gray-200 rounded-lg text-black flex flex-col"
                ></div>
            </section>
            <section
                class="flex flex-col bg-gray-800 mb-6 items-center p-3"
                id="contact"
            >
                <h1 class="text-3xl underline mb-6">Kontakt</h1>
                <form
                    id="contact-form"
                    method="post"
                    class="flex flex-col max-w-full gap-4 text-center border border-white p-3 rounded-lg"
                >
                    <div class="grid grid-cols-2">
                        <label
                            for="contact-name"
                            class="mr-3 text-right text-lg"
                            >Namn:</label
                        ><input
                            name="name"
                            type="text"
                            id="contact-name"
                            class="bg-white text-black p-1"
                            required
                        />
                    </div>
                    <div class="grid grid-cols-2">
                        <label
                            for="contact-email"
                            class="mr-3 text-right text-lg"
                            >E-postaddress:</label
                        ><input
                            name="email"
                            type="email"
                            id="contact-email"
                            class="bg-white text-black p-1"
                            required
                        />
                    </div>
                    <div class="grid grid-cols-2">
                        <label
                            for="contact-message"
                            class="mr-3 text-right text-lg"
                            >Meddelande:</label
                        >
                        <textarea
                            name="text"
                            id="contact-message"
                            class="bg-white text-black p-1"
                            required
                        ></textarea>
                    </div>
                    <div class="grid grid-cols-2">
                        <button
                            type="submit"
                            class="col-start-2 p-3 bg-gray-950 rounded-lg hover:bg-gray-900 hover:cursor-pointer"
                        >
                            Spara
                        </button>
                    </div>
                </form>
            </section>
        </main>
        <footer id="footer" class="h-10 p-2 text-center bg-gray-200 text-black">
            <p>Kursportalen @ 2026</p>
        </footer>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
