<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Frontend</title>
</head>

<body>
  <main class="bg-gray-700 text-white min-h-screen">
    <section id="hero">
      <header class="flex justify-between bg-black text-white h-15 items-center p-3 text-xl">
      <h1>Kursportalen</h1> 
      <nav class="flex gap-10">
          <h1>Start</h1><h1>Kurser</h1>
      </nav>
      </header>
      <div id="introText" class="min-h-25 p-5">
        <p>Lär dig bygga moderna webbapplikationer <br>
        Praktiska kurser inom webbutveckling, design och moderna verktyg.</p>
      </div>
      <div class="flex gap-8 p-5">
        <button class="p-3 bg-gray-950 rounded-lg hover:bg-gray-900 hover:cursor-pointer">
          Se kurser
        </button>
        <button class="p-3 bg-gray-950 rounded-lg hover:bg-gray-900 hover:cursor-pointer">
          Kontakta oss
        </button>
      </div>

    </section>
    <section id="courses"> 
      <h1>Kurser</h1>
      <div class="flex gap-8 p-5">
        <ul>
          <li class="bg-gray-200 text-black p-5 rounded-full flex flex-col">
            Webbutveckling från grunden
            <a class="text-blue-500 underline">[Läs mer]</a>
          </li>
        </ul>
      </div>
      <!--Kurser hamnar här-->
    </section>
    <section id="course-view">
      <h1>Kursvy</h1>
      <!--Här syns den aktiva kursen-->
    </section>
    <section id="contact">
      <h1>Kontakt</h1>
    </section>
  </main>
  <footer id="footer">
    <h1>Kursportalen @ 2026</h1>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
